site_name: Support extern
site_description: Haeufig gestellte Fragen und Anleitungen fuer die Nutzung unserer Dienste.
# site_url: https://example.org

docs_dir: .
site_dir: site

theme:
  name: material
  language: de
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Zu dunklem Modus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Zu hellem Modus wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Office 365:
      - Uebersicht: office365/index.md
  - WebUntis:
      - Uebersicht: webuntis/index.md
      - Schueler Login: webuntis/students-login.md
      - Eltern Login: webuntis/parents-login.md
