site_name: Support extern
site_description: Haeufig gestellte Fragen und Anleitungen fuer die Nutzung unserer Dienste.
# site_url: https://example.org

docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: blue grey
      accent: blue grey
  features:
    - navigation.sections
    - toc.integrate
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Office 365:
      - Uebersicht: office365/index.md
  - WebUntis:
      - Uebersicht: webuntis/index.md
      - Schueler Login: webuntis/students-login.md
      - Eltern Login: webuntis/parents-login.md
